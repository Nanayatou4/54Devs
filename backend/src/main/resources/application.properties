spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:${SERVER_PORT:8087}}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ORIGIN}

#Charte
app.projets.max-actifs-par-membre=2
#GitHub OAuth
app.github.client-id=${GITHUB_CLIENT_ID}
app.github.client-secret=${GITHUB_CLIENT_SECRET}

#Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}
