services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devs54
      POSTGRES_USER: devs54
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devs54 -d devs54"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/devs54
      DB_USERNAME: devs54
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:8080
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:8080/auth/callback/google
    ports:
      - "8087:8087"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8087/api
        VITE_APP_ORIGIN: http://localhost:8080
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  donnees-db: