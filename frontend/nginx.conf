server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les routes de React Router : une page inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par Vite peuvent être gardés longtemps par le navigateur
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}